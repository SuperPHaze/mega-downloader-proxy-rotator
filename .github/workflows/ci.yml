name: CI

# Suite Qt su Windows e macOS. Su Mac verifica anche una finestra nativa.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.11", "3.13"]
        include:
          - os: macos-15
            python-version: "3.14"
    env:
      # Qt headless: nessun display sui runner CI.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip (obbligatorio prima di requirements — vedi CLAUDE.md)
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check native macOS window and menus
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: python -m pytest -q tests/test_desktop_workspace.py -k "settings_action_and_language or single_page"
